name: Custom desktop preview
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing Flutter client configuration to bundle
        type: choice
        options: [staging, production]
        default: staging
      targets:
        description: Native platforms to build
        type: choice
        options: [all, windows-linux, windows-x64, windows-arm64, linux-x64, linux-arm64, macos-x64, macos-arm64]
        default: windows-linux
      macos_signing:
        description: macOS signing (ad-hoc is for internal previews only)
        type: choice
        options: [developer-id, ad-hoc]
        default: developer-id
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          python3 - <<'PY'
          import json, os
          rows = [
            {'id': 'linux-x64', 'runner': 'ubuntu-24.04', 'arch': 'x64'},
            {'id': 'linux-arm64', 'runner': 'ubuntu-24.04-arm', 'arch': 'arm64'},
            {'id': 'windows-x64', 'runner': 'windows-2022', 'arch': 'x64'},
            {'id': 'windows-arm64', 'runner': 'windows-11-arm', 'arch': 'arm64'},
            {'id': 'macos-x64', 'runner': 'macos-15-intel', 'arch': 'x64'},
            {'id': 'macos-arm64', 'runner': 'macos-15', 'arch': 'arm64'},
          ]
          selected = os.environ['TARGETS']
          rows = [r for r in rows if selected == 'all' or r['id'] == selected
                  or selected == 'windows-linux' and not r['id'].startswith('macos')]
          if not rows:
              raise ValueError('No build targets selected')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': rows}) + '\n')
          PY
  build:
    needs: matrix
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      MAX_OLD_SPACE_SIZE: '6144'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require private build repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = true
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check macOS signing configuration
        if: runner.os == 'macOS' && inputs.macos_signing != 'ad-hoc'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python dhimant-skilling/desktop/macos_credentials.py check
      - name: Check desktop packaging
        run: python -m unittest discover -s dhimant-skilling/desktop/tests -p 'test_*.py'
      - name: Native Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev libnss3 libgbm1 libasound2t64 libgtk-3-0t64 fakeroot dpkg-dev
      - name: Prepare Linux build memory
        if: runner.os == 'Linux'
        run: |
          # Remove unused preinstalled SDKs from this disposable hosted runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
          sudo fallocate -l 8G /desktop-build.swap
          sudo chmod 600 /desktop-build.swap
          sudo mkswap /desktop-build.swap
          sudo swapon /desktop-build.swap
          free -h
      - name: Build and check extension
        working-directory: dhimant-skilling/dhimantai-learning
        run: |
          npm ci
          npm run compile
          node --test out/test/desktopRoom.test.js ../desktop/tests/*.test.mjs
          npx --yes @vscode/vsce@3.2.1 package --no-dependencies --allow-missing-repository --baseContentUrl https://bitbucket.org/optficial/dhimantai/src/codex/question-bank-ux/dhimant-skilling/dhimantai-learning/ --out desktop.vsix
      - name: Prepare private client configuration
        env:
          CLIENT_ENVIRONMENT: ${{ inputs.environment }}
          FLUTTER_CONFIG: ${{ inputs.environment == 'staging' && secrets.FLUTTER_STAGING_ENV_JSON || secrets.FLUTTER_PRODUCTION_ENV_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          if not os.environ.get('FLUTTER_CONFIG'):
              raise RuntimeError('Configure the selected FLUTTER environment Actions secret first')
          data=json.loads(os.environ['FLUTTER_CONFIG'])
          target=Path(os.environ['RUNNER_TEMP'])/'desktop-flutter.json'
          target.write_text(json.dumps({key:data[key] for key in ['LIVEKIT_TOKEN_URL','LIVEKIT_TOKEN_SECRET']}))
          PY
      - name: Build native desktop
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python -m pip install Pillow==11.3.0
          python dhimant-skilling/desktop/build.py --stage prepare --cache "$RUNNER_TEMP/desktop-build" --arch "$TARGET_ARCH" 2>&1 | tee "$RUNNER_TEMP/desktop-build.log"
          python dhimant-skilling/desktop/build.py --stage build --cache "$RUNNER_TEMP/desktop-build" --arch "$TARGET_ARCH" 2>&1 | tee -a "$RUNNER_TEMP/desktop-build.log"
      - name: Import Developer ID and validate notarization credentials
        if: runner.os == 'macOS' && inputs.macos_signing != 'ad-hoc'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python dhimant-skilling/desktop/macos_credentials.py prepare
      - name: Package and verify native installer
        env:
          CLIENT_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_ARCH: ${{ matrix.arch }}
          MACOS_SIGNING: ${{ inputs.macos_signing || 'developer-id' }}
          MACOS_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && inputs.macos_signing != 'ad-hoc' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && inputs.macos_signing != 'ad-hoc' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          python dhimant-skilling/desktop/build.py --stage package --cache "$RUNNER_TEMP/desktop-build" --arch "$TARGET_ARCH" --vsix dhimant-skilling/dhimantai-learning/desktop.vsix --flutter-env "$CLIENT_ENVIRONMENT=$RUNNER_TEMP/desktop-flutter.json" --macos-signing "$MACOS_SIGNING" --out "$RUNNER_TEMP/desktop-artifacts" 2>&1 | tee -a "$RUNNER_TEMP/desktop-build.log"
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS' && inputs.macos_signing != 'ad-hoc'
        run: python dhimant-skilling/desktop/macos_credentials.py cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/desktop-artifacts/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.id }}
          path: ${{ runner.temp }}/desktop-build.log
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS' && inputs.macos_signing != 'ad-hoc'
        with:
          name: notarization-${{ matrix.id }}
          path: ${{ runner.temp }}/desktop-artifacts-notarization/
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove build configuration
        if: always()
        run: python -c "import os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'desktop-flutter.json').unlink(missing_ok=True)"
