name: Custom desktop preview
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
# Keep separate main pushes from building releases at the same time.
concurrency:
  group: desktop-preview-main
  cancel-in-progress: false
jobs:
  windows_x64:
    uses: ./.github/workflows/desktop-build.yml
    with:
      target: windows-x64
      runner: windows-2022
      arch: x64
    secrets: inherit
  windows_acceptance:
    needs: windows_x64
    uses: ./.github/workflows/desktop-windows-acceptance.yml
    with:
      arch: x64
  macos_arm64:
    needs: windows_acceptance
    uses: ./.github/workflows/desktop-build.yml
    with:
      target: macos-arm64
      runner: macos-15
      arch: arm64
      macos_signing: ad-hoc
    secrets: inherit
  macos_x64:
    needs: macos_arm64
    uses: ./.github/workflows/desktop-build.yml
    with:
      target: macos-x64
      runner: macos-15-intel
      arch: x64
      macos_signing: ad-hoc
    secrets: inherit
  linux_x64:
    needs: macos_x64
    uses: ./.github/workflows/desktop-build.yml
    with:
      target: linux-x64
      runner: ubuntu-24.04
      arch: x64
    secrets: inherit
