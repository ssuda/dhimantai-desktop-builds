name: Submit signed production desktop to Apple
on:
  push:
    branches: [codex/notarize-1-143-10012]
permissions:
  contents: read
jobs:
  submit:
    name: Submit ${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 40
    environment: mac-notarization-20261121
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            name: dhimantAI-1.143.10012-darwin-arm64.dmg
            sha256: cd5a2cf9f3451fce64bfea984cb0985bb1348efbda1de2ea911a9ce322642eda
            bytes: '284744136'
          - arch: x64
            name: dhimantAI-1.143.10012-darwin-x64.dmg
            sha256: 6f9982290de013f31bd969f417b5e833471390b13e249c14a43b37e4eec5ebf9
            bytes: '293394083'
    env:
      DMG_NAME: ${{ matrix.name }}
      EXPECTED_SHA: ${{ matrix.sha256 }}
      EXPECTED_BYTES: ${{ matrix.bytes }}
    steps:
      - name: Download and check the exact signed disk image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api repos/ssuda/dhimantai-desktop-builds/releases/453557118 | jq -er --arg n "$DMG_NAME" --arg sha "sha256:$EXPECTED_SHA" --argjson b "$EXPECTED_BYTES" 'select(.draft and .tag_name=="private-notary-inputs-1.143.10012")|.assets[]|select(.name==$n and .digest==$sha and .size==$b and .state=="uploaded")|.id')
          gh api -H 'Accept: application/octet-stream' "repos/ssuda/dhimantai-desktop-builds/releases/assets/$id" > "$RUNNER_TEMP/$DMG_NAME"
          actual=$(shasum -a 256 "$RUNNER_TEMP/$DMG_NAME" | cut -d' ' -f1)
          test "$actual" = "$EXPECTED_SHA"
          codesign --verify --strict -R '=anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "HSUM36L347"' "$RUNNER_TEMP/$DMG_NAME"
      - name: Upload the verified disk image to Apple
        shell: bash
        env:
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          xcrun notarytool store-credentials release-upload --apple-id samba.k@optficial.ai --team-id HSUM36L347 --password "$NOTARY_APP_PASSWORD" --validate >/dev/null
          unset NOTARY_APP_PASSWORD
          xcrun notarytool submit "$RUNNER_TEMP/$DMG_NAME" --keychain-profile release-upload --no-wait --output-format json > "$RUNNER_TEMP/notary.json"
          id=$(jq -er '.id | select(test("^[0-9a-fA-F-]{36}$"))' "$RUNNER_TEMP/notary.json")
          echo "NOTARY_SUBMISSION ${{ matrix.arch }} $id"
